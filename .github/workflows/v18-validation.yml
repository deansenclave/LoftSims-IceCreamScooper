name: v1.8 Three-Gate Validation
on:
  push:
    paths: [".github/workflows/v18-validation.yml","tests/test-v18.mjs","versions/v1.8/index.html"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - name: Gate 1 programmatic regression and Gate 2 evidence generation
        run: node tests/test-v18.mjs
      - name: Commit v1.8 evidence whether pass or fail
        if: always()
        run: |
          git config user.name "LoftSims Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add versions/v1.8/test-evidence
          git diff --cached --quiet || git commit -m "Add v1.8 test evidence"
          git pull --rebase origin main
          git push
