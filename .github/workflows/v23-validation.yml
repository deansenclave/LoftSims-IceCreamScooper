name: v2.3 Visual Evidence Validation
on:
  push:
    paths: [".github/workflows/v23-validation.yml","tests/test-v23.mjs","versions/v2.3/index.html"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/test-v23.mjs
      - if: always()
        run: |
          git config user.name "LoftSims Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add versions/v2.3/test-evidence
          git diff --cached --quiet || git commit -m "Add v2.3 test evidence"
          git pull --rebase origin main
          git push
