name: v1.3 Reality-Invariant Test
on: [workflow_dispatch]
permissions: {contents: write}
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '22'}
   - run: npm install playwright
   - run: npx playwright install --with-deps chromium
   - run: node tests/test-v13.mjs
   - run: |
       git config user.name "LoftSims Evidence Bot"
       git config user.email "actions@users.noreply.github.com"
       git add versions/v1.3/test-evidence
       git diff --cached --quiet || git commit -m "Add v1.3 reality-invariant test evidence"
       git push
