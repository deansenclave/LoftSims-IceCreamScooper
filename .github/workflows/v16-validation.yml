name: v1.6 Knowledge Reality Validation
on:
  push:
    paths: [".github/workflows/v16-validation.yml","tests/test-v16.mjs","versions/v1.6/index.html"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - name: Execute v1.6 knowledge-derived tests
        run: node tests/test-v16.mjs
      - name: Commit evidence for every test
        if: always()
        run: |
          git config user.name "LoftSims Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add versions/v1.6/test-evidence
          git diff --cached --quiet || git commit -m "Add v1.6 knowledge-validation evidence"
          git push