name: v2.1 Three-Gate Validation
on:
  push:
    paths: [".github/workflows/v21-validation.yml","tests/test-v21.mjs","versions/v2.1/index.html"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - name: Full regression and test-time evidence
        run: node tests/test-v21.mjs
      - name: Commit v2.1 evidence whether pass or fail
        if: always()
        run: |
          git config user.name "LoftSims Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add versions/v2.1/test-evidence
          git diff --cached --quiet || git commit -m "Add v2.1 test evidence"
          git pull --rebase origin main
          git push
