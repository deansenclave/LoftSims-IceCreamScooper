name: v3.0 Full Validation
on:
  push:
    paths: [".github/workflows/v30-validation.yml","tests/test-v30.mjs","versions/v3.0/index.html"]
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/test-v30.mjs
      - if: always()
        run: |
          git config user.name "LoftSims Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add versions/v3.0/test-evidence
          git diff --cached --quiet || git commit -m "Add v3.0 test evidence"
          git pull --rebase origin main
          git push
